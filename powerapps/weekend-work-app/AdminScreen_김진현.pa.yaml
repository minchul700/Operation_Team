Screens:
  AdminScreen_김진현:
    Properties:
      Fill: =RGBA(246, 247, 249, 1)
    Children:
      - S6Root:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(246, 247, 249, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =If(Parent.Width < 720, LayoutDirection.Vertical, LayoutDirection.Horizontal)
            Width: =Parent.Width
          Children:
            - S6DesktopRail:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(239, 241, 244, 1)
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =16
                  PaddingLeft: =14
                  PaddingRight: =14
                  PaddingTop: =22
                  Visible: =Parent.Width >= 720
                  Width: =220
                Children:
                  - S6RailTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="주말근무 신청 시스템"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(32, 39, 48, 1)
                        FontWeight: =FontWeight.Semibold
                        Height: =54
                        PaddingBottom: =4
                        PaddingLeft: =4
                        PaddingRight: =4
                        PaddingTop: =4
                        Size: =18
                        Text: ="주말근무 신청 시스템"
                        Width: =Parent.Width
                  - S6NavHome:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="홈으로 이동"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        OnSelect: =Navigate(HomeScreen_이승우)
                        Text: ="홈"
                        Width: =Parent.Width
                  - S6NavPlanned:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 예정 신청 화면으로 이동"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        OnSelect: =Navigate(PlannedRequestScreen_권민철)
                        Text: ="주말근무 예정 신청"
                        Width: =Parent.Width
                  - S6NavCompleted:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 완료 신청 화면으로 이동"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        OnSelect: =Navigate(CompletedRequestScreen_윤대진)
                        Text: ="주말근무 완료 신청"
                        Width: =Parent.Width
                  - S6NavInquiry:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="조회 안내 화면으로 이동"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        OnSelect: =Navigate(InquiryScreen_이형대)
                        Text: ="조회"
                        Width: =Parent.Width
                  - S6NavCalendar:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="캘린더 안내 화면으로 이동"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        OnSelect: =Navigate(CalendarScreen_최해우)
                        Text: ="캘린더"
                        Width: =Parent.Width
                  - S6NavAdmin:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="관리자 조회, 현재 화면"
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =48
                        OnSelect: =Navigate(AdminScreen_김진현)
                        Text: ="관리자 조회"
                        Width: =Parent.Width
            - S6PhoneHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =60
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =8
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =8
                  Visible: =Parent.Width < 720
                  Width: =Parent.Width
                Children:
                  - S6MenuToggle:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="탐색 메뉴 열기 또는 닫기"
                        Appearance: =ButtonAppearance.Outline
                        Height: =44
                        OnSelect: |-
                          =UpdateContext({locNavOpen: !locNavOpen})
                        Text: ="메뉴"
                        Width: =72
                  - S6PhoneTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="관리자 조회"
                        Align: =Align.Right
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(32, 39, 48, 1)
                        FillPortions: =1
                        FontWeight: =FontWeight.Semibold
                        Height: =40
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =17
                        Text: ="관리자 조회"
                        Width: =Parent.Width - 100
                        Wrap: =false
            - S6PhoneNav:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(239, 241, 244, 1)
                  FillPortions: =0
                  Height: =328
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =8
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =8
                  Visible: =Parent.Width < 720 && locNavOpen
                  Width: =Parent.Width
                Children:
                  - S6PhoneNavHome:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="홈으로 이동"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        OnSelect: =Navigate(HomeScreen_이승우)
                        Text: ="홈"
                        Width: =Parent.Width
                  - S6PhoneNavPlanned:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 예정 신청 화면으로 이동"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        OnSelect: =Navigate(PlannedRequestScreen_권민철)
                        Text: ="주말근무 예정 신청"
                        Width: =Parent.Width
                  - S6PhoneNavCompleted:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 완료 신청 화면으로 이동"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        OnSelect: =Navigate(CompletedRequestScreen_윤대진)
                        Text: ="주말근무 완료 신청"
                        Width: =Parent.Width
                  - S6PhoneNavInquiry:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="조회 안내 화면으로 이동"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        OnSelect: =Navigate(InquiryScreen_이형대)
                        Text: ="조회"
                        Width: =Parent.Width
                  - S6PhoneNavCalendar:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="캘린더 안내 화면으로 이동"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        OnSelect: =Navigate(CalendarScreen_최해우)
                        Text: ="캘린더"
                        Width: =Parent.Width
                  - S6PhoneNavAdmin:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="관리자 조회, 현재 화면"
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =48
                        OnSelect: =Navigate(AdminScreen_김진현)
                        Text: ="관리자 조회"
                        Width: =Parent.Width
            - S6MainScroll:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(246, 247, 249, 1)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =20
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =28
                  PaddingLeft: =If(Parent.Width < 720, 16, 32)
                  PaddingRight: =If(Parent.Width < 720, 16, 32)
                  PaddingTop: =24
                Children:
                  - S6Heading:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =88
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =Parent.Width
                      Children:
                        - S6Title:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="관리자 조회"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(32, 39, 48, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =38
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =24
                              Text: ="관리자 조회 -> 기존내부앱처럼 비밀번호 기능 추가"
                              Width: =Parent.Width
                              Wrap: =false
                        - S6Subtitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="관리자 기능 연결 안내"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(91, 99, 109, 1)
                              Height: =40
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: ="관리자 기능 연결 안내"
                              Width: =Parent.Width
                  - S6GuidanceCard:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(224, 228, 233, 1)
                        BorderThickness: =1
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =176
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =12
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =24
                        PaddingLeft: =24
                        PaddingRight: =24
                        PaddingTop: =24
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =Parent.Width
                      Children:
                        - S6GuidanceTitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="관리 기능 안내"
                              Align: =Align.Center
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(32, 39, 48, 1)
                              FontWeight: =FontWeight.Semibold
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =18
                              Text: ="관리 기능 안내"
                              Width: =Parent.Width
                              Wrap: =false
                        - S6GuidanceMessage:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="관리자 기능은 데이터와 업무 절차 연결 후 이용할 수 있습니다."
                              Align: =Align.Center
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(61, 69, 79, 1)
                              Height: =64
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =16
                              Text: |-
                                ="관리자 기능은 데이터와 업무 절차 연결 후 이용할 수 있습니다.

                                승인, 반려 조회 필터화면 / 최신순 / 반려사유 / 이름별 조회 / 엑셀다운ㄹ드 기능 / 반려승인 메일발송 / 날짜별 조ㅎ회 / 승인자별 반려, 승인 status가능하면 추가 / 승인,대기,완료 ui는 휴가앱과 동일한 색상"
                              Width: =Parent.Width
