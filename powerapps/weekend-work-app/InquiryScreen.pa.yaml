Screens:
  InquiryScreen:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
    Children:
      - S4Root:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 246, 248, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =If(Parent.Width < 720, LayoutDirection.Vertical, LayoutDirection.Horizontal)
            Width: =Parent.Width
          Children:
            - S4DesktopRail:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(248, 249, 251, 1)
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =20
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =20
                  Visible: =Parent.Width >= 720
                  Width: =220
                Children:
                  - S4RailTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="주말근무 신청 시스템"
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =RGBA(32, 42, 57, 1)
                        FontWeight: ='FontWeight'.Semibold
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        Size: =18
                        Text: ="주말근무 신청"
                        Width: =Parent.Width - 24
                  - S4NavHome:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="홈 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(Screen1_이승우)
                        Text: ="홈"
                        Width: =Parent.Width - 24
                  - S4NavPlanned:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 예정 신청 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(PlannedRequestScreen)
                        Text: ="주말근무 예정 신청"
                        Width: =Parent.Width - 24
                  - S4NavCompleted:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 완료 신청 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(CompletedRequestScreen)
                        Text: ="주말근무 완료 신청"
                        Width: =Parent.Width - 24
                  - S4NavInquiry:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 신청 조회 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Primary
                        Height: =48
                        OnSelect: =Navigate(InquiryScreen)
                        Text: ="조회"
                        Width: =Parent.Width - 24
                  - S4NavCalendar:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="캘린더 안내 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(CalendarScreen)
                        Text: ="캘린더"
                        Width: =Parent.Width - 24
                  - S4NavAdmin:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="관리자 조회 안내 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(AdminScreen)
                        Text: ="관리자 조회"
                        Width: =Parent.Width - 24
            - S4PhoneTopBar:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =8
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =8
                  Visible: =Parent.Width < 720
                  Width: =Parent.Width
                Children:
                  - S4PhoneMenuButton:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: =If(Coalesce(locNavOpen, false), "탐색 메뉴 닫기", "탐색 메뉴 열기")
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: ='ButtonAppearance'.Secondary
                        Height: =48
                        OnSelect: |-
                          =UpdateContext({locNavOpen: !Coalesce(locNavOpen, false)})
                        Text: =If(Coalesce(locNavOpen, false), "닫기", "메뉴")
                        Width: =64
                  - S4PhoneTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="주말근무 신청 시스템"
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =RGBA(32, 42, 57, 1)
                        FillPortions: =1
                        FontWeight: ='FontWeight'.Semibold
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =18
                        Text: ="주말근무 신청"
            - S4PhoneNavigation:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =320
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =8
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =8
                  Visible: =Parent.Width < 720 && Coalesce(locNavOpen, false)
                  Width: =Parent.Width
                Children:
                  - S4PhoneNavHome:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="홈 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(Screen1_이승우)
                        Text: ="홈"
                        Width: =Parent.Width - 24
                  - S4PhoneNavPlanned:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 예정 신청 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(PlannedRequestScreen)
                        Text: ="주말근무 예정 신청"
                        Width: =Parent.Width - 24
                  - S4PhoneNavCompleted:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 완료 신청 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(CompletedRequestScreen)
                        Text: ="주말근무 완료 신청"
                        Width: =Parent.Width - 24
                  - S4PhoneNavInquiry:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 신청 조회 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Primary
                        Height: =48
                        OnSelect: =Navigate(InquiryScreen)
                        Text: ="조회"
                        Width: =Parent.Width - 24
                  - S4PhoneNavCalendar:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="캘린더 안내 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(CalendarScreen)
                        Text: ="캘린더"
                        Width: =Parent.Width - 24
                  - S4PhoneNavAdmin:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="관리자 조회 안내 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(AdminScreen)
                        Text: ="관리자 조회"
                        Width: =Parent.Width - 24
            - S4MainContent:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(245, 246, 248, 1)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =20
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =28
                  PaddingLeft: =If(Parent.Width < 720, 16, 32)
                  PaddingRight: =If(Parent.Width < 720, 16, 32)
                  PaddingTop: =28
                Children:
                  - S4PageHeading:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: |-
                          ="페이지 제목: 주말근무 신청 조회"
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =RGBA(32, 42, 57, 1)
                        FontWeight: ='FontWeight'.Semibold
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =28
                        Text: ="주말근무 신청 조회"
                  - S4Description:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="신청 조회 화면 안내"
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =RGBA(83, 94, 108, 1)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: ="신청 정보를 저장할 데이터 연결이 아직 설정되지 않았습니다."
                  - S4GuidanceCard:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(224, 228, 233, 1)
                        BorderThickness: =1
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =160
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =24
                        PaddingLeft: =24
                        PaddingRight: =24
                        PaddingTop: =24
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                      Children:
                        - S4GuidanceTitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="조회 안내"
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =RGBA(32, 42, 57, 1)
                              FontWeight: ='FontWeight'.Semibold
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =18
                              Text: ="조회 안내"
                              Wrap: =false
                        - S4GuidanceMessage:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="신청 내역 조회는 데이터 저장 기능 연결 후 이용할 수 있습니다."
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =RGBA(83, 94, 108, 1)
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =16
                              Text: ="신청 내역 조회는 데이터 저장 기능 연결 후 이용할 수 있습니다."
                  - S4HomeButton:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="홈으로 돌아가기"
                        AlignInContainer: =AlignInContainer.Start
                        Appearance: ='ButtonAppearance'.Secondary
                        Height: =48
                        OnSelect: =Navigate(Screen1_이승우)
                        Text: ="홈으로 돌아가기"
                        Width: =220
