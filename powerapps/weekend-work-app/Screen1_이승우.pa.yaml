Screens:
  Screen1_이승우:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
    Children:
      - S1Root:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 246, 248, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =If(Parent.Width < 720, LayoutDirection.Vertical, LayoutDirection.Horizontal)
            Width: =Parent.Width
          Children:
            - S1DesktopRail:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(248, 249, 251, 1)
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =20
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =20
                  Visible: =Parent.Width >= 720
                  Width: =220
                Children:
                  - S1RailTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="주말근무 신청 시스템"
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =RGBA(32, 42, 57, 1)
                        FontWeight: ='FontWeight'.Semibold
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        Size: =18
                        Text: ="주말근무 신청"
                        Width: =Parent.Width
                  - S1NavHome:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="홈 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Primary
                        Height: =48
                        OnSelect: =Navigate(Screen1_이승우)
                        Text: ="홈"
                        Width: =Parent.Width
                  - S1NavPlanned:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 예정 신청 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(PlannedRequestScreen_권민철)
                        Text: ="주말근무 예정 신청"
                        Width: =Parent.Width
                  - S1NavCompleted:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 완료 신청 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(CompletedRequestScreen_윤대진)
                        Text: ="주말근무 완료 신청"
                        Width: =Parent.Width
                  - S1NavInquiry:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="신청 조회 안내 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(InquiryScreen_이형대)
                        Text: ="조회"
                        Width: =Parent.Width
                  - S1NavCalendar:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="캘린더 안내 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(CalendarScreen_최해우)
                        Text: ="캘린더"
                        Width: =Parent.Width
                  - S1NavAdmin:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="관리자 조회 안내 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(AdminScreen_김진현)
                        Text: ="관리자 조회"
                        Width: =Parent.Width
            - S1PhoneTopBar:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =8
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =8
                  Visible: =Parent.Width < 720
                  Width: =Parent.Width
                Children:
                  - S1PhoneMenuButton:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: =If(Coalesce(locNavOpen, false), "탐색 메뉴 닫기", "탐색 메뉴 열기")
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: ='ButtonAppearance'.Secondary
                        Height: =48
                        OnSelect: |-
                          =UpdateContext({locNavOpen: !Coalesce(locNavOpen, false)})
                        Text: =If(Coalesce(locNavOpen, false), "닫기", "메뉴")
                        Width: =64
                  - S1PhoneTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="주말근무 신청 시스템"
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =RGBA(32, 42, 57, 1)
                        FillPortions: =1
                        FontWeight: ='FontWeight'.Semibold
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =18
                        Text: ="주말근무 신청"
            - S1PhoneNavigation:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =360
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =8
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =8
                  Visible: =Parent.Width < 720 && Coalesce(locNavOpen, false)
                  Width: =Parent.Width
                Children:
                  - S1PhoneNavHome:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="홈 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Primary
                        Height: =48
                        OnSelect: =Navigate(Screen1_이승우)
                        Text: ="홈"
                        Width: =Parent.Width
                  - S1PhoneNavPlanned:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 예정 신청 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(PlannedRequestScreen_권민철)
                        Text: ="주말근무 예정 신청"
                        Width: =Parent.Width
                  - S1PhoneNavCompleted:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 완료 신청 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(CompletedRequestScreen_윤대진)
                        Text: ="주말근무 완료 신청"
                        Width: =Parent.Width
                  - S1PhoneNavInquiry:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="신청 조회 안내 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(InquiryScreen_이형대)
                        Text: ="조회"
                        Width: =Parent.Width
                  - S1PhoneNavCalendar:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="캘린더 안내 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(CalendarScreen_최해우)
                        Text: ="캘린더"
                        Width: =Parent.Width
                  - S1PhoneNavAdmin:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="관리자 조회 안내 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(AdminScreen_김진현)
                        Text: ="관리자 조회"
                        Width: =Parent.Width
            - S1MainContent:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(245, 246, 248, 1)
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =20
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =28
                  PaddingLeft: =If(Parent.Width < 720, 16, 32)
                  PaddingRight: =If(Parent.Width < 720, 16, 32)
                  PaddingTop: =28
                Children:
                  - S1PageHeading:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: |-
                          ="페이지 제목: 주말근무 신청 시스템"
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =RGBA(32, 42, 57, 1)
                        FontWeight: ='FontWeight'.Semibold
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =28
                        Text: |-
                          ="주말근무 신청 시스템 -> 조직도별 분리(1차 승인자) -> 임원 (2차 승인자), 경영지원팀은 합의자 (3차 합의자)
                          "
                  - S1Intro:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="이 앱은 화면 시안이며 신청 저장 기능은 연결되어 있지 않습니다."
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =RGBA(83, 94, 108, 1)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: ="예정·완료 신청 화면과 안내 메뉴를 이용할 수 있습니다. 현재 신청 저장 기능은 연결되어 있지 않습니다."
                  - S1ShortcutRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(245, 246, 248, 1)
                        FillPortions: =0
                        Height: =If(Parent.Width < 720, 288, 144)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =If(Parent.Width < 720, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - S1PlannedCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(224, 228, 233, 1)
                              BorderThickness: =1
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =144
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =10
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =12
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =12
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                            Children:
                              - S1PlannedTitle:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="예정 신청"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =RGBA(32, 42, 57, 1)
                                    FontWeight: ='FontWeight'.Semibold
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =20
                                    Text: ="주말근무 예정 신청 -> 독립적"
                              - S1PlannedCopy:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="근무 예정일과 예상 근무 내용을 입력합니다."
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =RGBA(83, 94, 108, 1)
                                    FillPortions: =1
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =14
                                    Text: ="근무 예정일과 예상 근무 내용을 입력합니다."
                              - S1PlannedAction:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="주말근무 예정 신청 입력 시작"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Appearance: ='ButtonAppearance'.Primary
                                    Height: =48
                                    OnSelect: =Navigate(PlannedRequestScreen_권민철)
                                    Text: ="예정 신청 시작"
                                    Width: =Parent.Width
                        - S1CompletedCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(224, 228, 233, 1)
                              BorderThickness: =1
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =144
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =10
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =12
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =12
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                            Children:
                              - S1CompletedTitle:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="완료 신청"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =RGBA(32, 42, 57, 1)
                                    FontWeight: ='FontWeight'.Semibold
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =20
                                    Text: ="주말근무 완료 신청 -> 예정 신청에 대한 완료"
                              - S1CompletedCopy:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="실제 근무일과 완료한 근무 내용을 입력합니다."
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =RGBA(83, 94, 108, 1)
                                    FillPortions: =1
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =14
                                    Text: ="실제 근무일과 완료한 근무 내용을 입력합니다."
                              - S1CompletedAction:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="주말근무 완료 신청 입력 시작"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Appearance: ='ButtonAppearance'.Secondary
                                    Height: =48
                                    OnSelect: =Navigate(CompletedRequestScreen_윤대진)
                                    Text: ="완료 신청 시작"
                                    Width: =Parent.Width
                  - S1EmptyCard:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(224, 228, 233, 1)
                        BorderThickness: =1
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =112
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =20
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =20
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                      Children:
                        - S1EmptyTitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="신청 내역"
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =RGBA(32, 42, 57, 1)
                              FontWeight: ='FontWeight'.Semibold
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =18
                              Text: ="본인 신청 내역 -> 갤러리로 변경"
                              Wrap: =false
                        - S1EmptyMessage:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="신청 내역이 없습니다."
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =RGBA(83, 94, 108, 1)
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Text: ="신청 내역이 없습니다."
            - Button1:
                Control: Classic/Button
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 0)
                  BorderStyle: =BorderStyle.None
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(0, 0, 0, 0)
                  DisabledColor: =RGBA(161, 159, 157, 1)
                  DisabledFill: =RGBA(242, 242, 241, 0)
                  Fill: =RGBA(0, 120, 212, 1)
                  Font: =Font.'Segoe UI'
                  HoverBorderColor: =RGBA(0, 0, 0, 0)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(16, 110, 190, 1)
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PressedBorderColor: =RGBA(0, 69, 120, 1)
                  PressedColor: =RGBA(255, 255, 255, 1)
                  PressedFill: =RGBA(16, 110, 190, 1)
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
