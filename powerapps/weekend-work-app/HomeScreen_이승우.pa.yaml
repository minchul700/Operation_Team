Screens:
  HomeScreen_이승우:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
    Children:
      - S1Root:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 246, 248, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =If(Parent.Width < 720, LayoutDirection.Vertical, LayoutDirection.Horizontal)
            Width: =Parent.Width
          Children:
            - S1DesktopRail:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(248, 249, 251, 1)
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =20
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =20
                  Visible: =Parent.Width >= 720
                  Width: =220
                Children:
                  - S1RailTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="주말근무 신청 시스템"
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =RGBA(32, 42, 57, 1)
                        FontWeight: ='FontWeight'.Semibold
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        Size: =18
                        Text: ="주말근무 신청"
                        Width: =Parent.Width
                  - S1NavHome:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="홈 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Primary
                        Height: =48
                        OnSelect: =Navigate(HomeScreen_이승우)
                        Text: ="홈"
                        Width: =Parent.Width
                  - S1NavPlanned:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 예정 신청 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(PlannedRequestScreen_권민철)
                        Text: ="주말근무 예정 신청"
                        Width: =Parent.Width
                  - S1NavCompleted:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 완료 신청 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(CompletedRequestScreen_윤대진)
                        Text: ="주말근무 완료 신청"
                        Width: =Parent.Width
                  - S1NavInquiry:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="신청 조회 안내 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(InquiryScreen_이형대)
                        Text: ="조회"
                        Width: =Parent.Width
                  - S1NavCalendar:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="캘린더 안내 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(CalendarScreen_최해우)
                        Text: ="캘린더"
                        Width: =Parent.Width
                  - S1NavAdmin:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="관리자 조회 안내 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(AdminScreen_김진현)
                        Text: ="관리자 조회"
                        Width: =Parent.Width
            - S1PhoneTopBar:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =8
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =8
                  Visible: =Parent.Width < 720
                  Width: =Parent.Width
                Children:
                  - S1PhoneMenuButton:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: =If(Coalesce(locNavOpen, false), "탐색 메뉴 닫기", "탐색 메뉴 열기")
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: ='ButtonAppearance'.Secondary
                        Height: =48
                        OnSelect: |-
                          =UpdateContext({locNavOpen: !Coalesce(locNavOpen, false)})
                        Text: =If(Coalesce(locNavOpen, false), "닫기", "메뉴")
                        Width: =64
                  - S1PhoneTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="주말근무 신청 시스템"
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =RGBA(32, 42, 57, 1)
                        FillPortions: =1
                        FontWeight: ='FontWeight'.Semibold
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =18
                        Text: ="주말근무 신청"
            - S1PhoneNavigation:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =360
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =8
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =8
                  Visible: =Parent.Width < 720 && Coalesce(locNavOpen, false)
                  Width: =Parent.Width
                Children:
                  - S1PhoneNavHome:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="홈 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Primary
                        Height: =48
                        OnSelect: =Navigate(HomeScreen_이승우)
                        Text: ="홈"
                        Width: =Parent.Width
                  - S1PhoneNavPlanned:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 예정 신청 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(PlannedRequestScreen_권민철)
                        Text: ="주말근무 예정 신청"
                        Width: =Parent.Width
                  - S1PhoneNavCompleted:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 완료 신청 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(CompletedRequestScreen_윤대진)
                        Text: ="주말근무 완료 신청"
                        Width: =Parent.Width
                  - S1PhoneNavInquiry:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="신청 조회 안내 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(InquiryScreen_이형대)
                        Text: ="조회"
                        Width: =Parent.Width
                  - S1PhoneNavCalendar:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="캘린더 안내 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(CalendarScreen_최해우)
                        Text: ="캘린더"
                        Width: =Parent.Width
                  - S1PhoneNavAdmin:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="관리자 조회 안내 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(AdminScreen_김진현)
                        Text: ="관리자 조회"
                        Width: =Parent.Width
            - S1MainContent:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(245, 246, 248, 1)
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =20
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =28
                  PaddingLeft: =If(Parent.Width < 720, 16, 32)
                  PaddingRight: =If(Parent.Width < 720, 16, 32)
                  PaddingTop: =28
                Children:
                  - S1PageHeading:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: |-
                          ="페이지 제목: 주말근무 신청 시스템"
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =RGBA(32, 42, 57, 1)
                        FontWeight: ='FontWeight'.Semibold
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =28
                        Text: ="주말근무 신청 시스템"
                  - S1Intro:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="승인 절차 안내. 조직도별 1차 승인, 임원 2차 승인, 경영지원팀 합의. 현재 저장과 승인 기능은 연결되어 있지 않습니다."
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =RGBA(83, 94, 108, 1)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: |-
                          ="승인 절차 안내: 조직도별 1차 승인 → 임원 2차 승인 → 경영지원팀 합의. 현재 저장·승인 기능은 연결되어 있지 않습니다."
                  - S1ShortcutRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Fill: =RGBA(245, 246, 248, 1)
                        FillPortions: =0
                        Height: =144
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =If(Parent.Width < 720, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - S1PlannedCard:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(224, 228, 233, 1)
                              BorderThickness: =1
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =144
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =10
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =12
                              PaddingLeft: =16
                              PaddingRight: =16
                              PaddingTop: =12
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                            Children:
                              - S1PlannedTitle:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="예정 신청"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =RGBA(32, 42, 57, 1)
                                    FontWeight: ='FontWeight'.Semibold
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =20
                                    Text: ="주말근무 예정 신청"
                              - S1PlannedCopy:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="근무 예정일과 예상 근무 내용을 입력합니다."
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =RGBA(83, 94, 108, 1)
                                    FillPortions: =1
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =14
                                    Text: ="근무 예정일과 예상 근무 내용을 입력합니다."
                              - S1PlannedAction:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="주말근무 예정 신청 입력 시작"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Appearance: ='ButtonAppearance'.Primary
                                    Height: =48
                                    OnSelect: =Navigate(PlannedRequestScreen_권민철)
                                    Text: ="예정 신청 시작"
                                    Width: =Parent.Width
                  - S1EmptyCard:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(224, 228, 233, 1)
                        BorderThickness: =1
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =If(Parent.Width < 720, 560, 520)
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =20
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =20
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                      Children:
                        - S1EmptyTitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="신청 내역"
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =RGBA(32, 42, 57, 1)
                              FontWeight: ='FontWeight'.Semibold
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =18
                              Text: ="본인 신청 내역"
                              Wrap: =false
                        - S1EmptyMessage:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="아래 신청 내역은 화면 예시이며 실제 저장된 내역이 아닙니다. 항목을 선택하면 상세 내용을 볼 수 있습니다."
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =RGBA(83, 94, 108, 1)
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Text: ="화면 예시입니다. 실제 저장된 신청 내역은 아니며, 항목을 선택하면 상세 내용을 볼 수 있습니다."
                        - galS1DemoRequests:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              AccessibleLabel: ="예시 신청 내역 목록"
                              FillPortions: =0
                              Height: =176
                              Items: |-
                                =Table(
                                  {RequestId: "DEMO-001", RequestType: "예정 신청", WorkDate: DateAdd(Today(), 3, TimeUnit.Days), ProjectName: "샘플 프로젝트 A", WorkPlace: "샘플 근무 장소", WorkTime: "09:00~13:00", Reason: "예시: 주말 점검"},
                                  {RequestId: "DEMO-002", RequestType: "완료 신청", WorkDate: DateAdd(Today(), -3, TimeUnit.Days), ProjectName: "샘플 프로젝트 B", WorkPlace: "샘플 근무 장소", WorkTime: "10:00~15:00", Reason: "예시: 긴급 지원"}
                                )
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              ShowScrollbar: =false
                              TabIndex: =0
                              TemplatePadding: =4
                              TemplateSize: =78
                            Children:
                              - btnS1DemoRequestRow:
                                  Control: Classic/Button
                                  Properties:
                                    Align: =Align.Left
                                    BorderColor: =RGBA(220, 230, 240, 1)
                                    BorderThickness: =1
                                    Color: =RGBA(32, 42, 57, 1)
                                    Fill: =If(!IsBlank(locSelectedDemoRequest) && locSelectedDemoRequest.RequestId = ThisItem.RequestId, RGBA(225, 239, 252, 1), RGBA(247, 250, 252, 1))
                                    Height: =66
                                    HoverFill: =RGBA(231, 242, 252, 1)
                                    OnSelect: |-
                                      =UpdateContext({locSelectedDemoRequest: ThisItem})
                                    PaddingLeft: =14
                                    PressedFill: =RGBA(210, 232, 250, 1)
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Size: =13
                                    Text: =ThisItem.RequestType & " · " & Text(ThisItem.WorkDate, "yyyy-mm-dd") & " · " & ThisItem.ProjectName
                                    Tooltip: ="예시 신청 " & ThisItem.RequestId & " 상세 보기"
                                    Width: =Parent.TemplateWidth - 12
                                    X: =6
                                    Y: =4
                        - conS1DemoRequestDetail:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              BorderColor: =RGBA(220, 230, 240, 1)
                              BorderThickness: =1
                              Fill: =RGBA(247, 250, 253, 1)
                              FillPortions: =0
                              Height: =If(Parent.Width < 720, 220, 180)
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =12
                              PaddingLeft: =14
                              PaddingRight: =14
                              PaddingTop: =12
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Visible: =!IsBlank(locSelectedDemoRequest)
                            Children:
                              - txtS1DemoDetailTitle:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="선택한 예시 신청의 상세 제목"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =RGBA(32, 42, 57, 1)
                                    FontWeight: ='FontWeight'.Semibold
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =16
                                    Text: =locSelectedDemoRequest.RequestType & " · " & Text(locSelectedDemoRequest.WorkDate, "yyyy-mm-dd") & " (예시)"
                              - txtS1DemoDetailBody:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="선택한 예시 신청의 상세 내용"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    AutoHeight: =true
                                    Color: =RGBA(83, 94, 108, 1)
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =14
                                    Text: |-
                                      ="프로젝트: " & locSelectedDemoRequest.ProjectName & Char(10) &
                                        "근무 장소: " & locSelectedDemoRequest.WorkPlace & Char(10) &
                                        "근무 시간: " & locSelectedDemoRequest.WorkTime & Char(10) &
                                        "사유: " & locSelectedDemoRequest.Reason
