Screens:
  CalendarScreen_최해우:
    Properties:
      Fill: =RGBA(245, 246, 248, 1)
    Children:
      - S5Root:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =If(Parent.Width < 720, LayoutDirection.Vertical, LayoutDirection.Horizontal)
            Width: =Parent.Width
          Children:
            - S5Navigation:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(240, 242, 245, 1)
                  FillPortions: =0
                  Height: =If(Parent.Width < 720, 176, Parent.Height)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(Parent.Width < 720, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutWrap: =Parent.Width < 720
                  PaddingBottom: =8
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =If(Parent.Width < 720, 8, 20)
                  Width: =If(Parent.Width < 720, Parent.Width, 220)
                Children:
                  - S5NavBrand:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="주말근무 신청 시스템"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(32, 44, 60, 1)
                        FontWeight: =FontWeight.Semibold
                        Height: =40
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =4
                        PaddingRight: =4
                        PaddingTop: =0
                        Size: =18
                        Text: ="주말근무 신청"
                        Visible: =Parent.Width >= 720
                        Width: =Parent.Width
                        Wrap: =false
                  - S5NavHome:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="홈으로 이동"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        Layout: =ButtonLayout.TextOnly
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(HomeScreen_이승우, ScreenTransition.Fade)
                        Text: ="홈"
                        Width: =If(Parent.Width < 720, 96, Parent.Width)
                  - S5NavPlanned:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 예정 신청 화면"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        Layout: =ButtonLayout.TextOnly
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(PlannedRequestScreen_권민철, ScreenTransition.Fade)
                        Text: ="예정 신청"
                        Width: =If(Parent.Width < 720, 120, Parent.Width)
                  - S5NavCompleted:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 완료 신청 화면"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        Layout: =ButtonLayout.TextOnly
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(CompletedRequestScreen_윤대진, ScreenTransition.Fade)
                        Text: ="완료 신청"
                        Width: =If(Parent.Width < 720, 120, Parent.Width)
                  - S5NavInquiry:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="조회 안내 화면"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        Layout: =ButtonLayout.TextOnly
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(InquiryScreen_이형대, ScreenTransition.Fade)
                        Text: ="조회"
                        Width: =If(Parent.Width < 720, 96, Parent.Width)
                  - S5NavCalendar:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 캘린더 화면, 현재 화면"
                        AlignInContainer: =AlignInContainer.Stretch
                        DisplayMode: =DisplayMode.Disabled
                        Height: =48
                        Layout: =ButtonLayout.TextOnly
                        LayoutMinWidth: =0
                        Text: ="캘린더"
                        Width: =If(Parent.Width < 720, 110, Parent.Width)
                  - S5NavAdmin:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="관리자 안내 화면"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        Layout: =ButtonLayout.TextOnly
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(AdminScreen_김진현, ScreenTransition.Fade)
                        Text: ="관리자 조회"
                        Width: =If(Parent.Width < 720, 120, Parent.Width)
            - S5Main:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(245, 246, 248, 1)
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =24
                  PaddingLeft: =If(Parent.Width < 720, 16, 32)
                  PaddingRight: =If(Parent.Width < 720, 16, 32)
                  PaddingTop: =24
                  Width: =Parent.Width
                Children:
                  - S5PageHeading:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =56
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - S5PageTitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="주말근무 캘린더"
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =RGBA(32, 44, 60, 1)
                              FontWeight: =FontWeight.Semibold
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =24
                              Text: ="주말근무 캘린더"
                  - S5GuidanceCard:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(226, 230, 235, 1)
                        BorderThickness: =1
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =148
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =24
                        PaddingLeft: =24
                        PaddingRight: =24
                        PaddingTop: =24
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                      Children:
                        - S5GuidanceMessage:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="일정 정보는 주말근무 데이터 연결 후 표시됩니다."
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =RGBA(50, 60, 75, 1)
                              Height: =48
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =16
                              Text: ="일정 정보는 주말근무 데이터 연결 후 표시됩니다."
                  - S5CalendarCard:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(226, 230, 235, 1)
                        BorderThickness: =1
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =408
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                      Children:
                        - S5MonthNavigation:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =48
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - S5PreviousMonth:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="이전 달"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Appearance: =ButtonAppearance.Subtle
                                    Height: =48
                                    Layout: =ButtonLayout.TextOnly
                                    LayoutMinWidth: =48
                                    OnSelect: |-
                                      =Set(varCalendarMonth, DateAdd(Date(Year(Coalesce(varCalendarMonth, Today())), Month(Coalesce(varCalendarMonth, Today())), 1), -1, TimeUnit.Months));
                                      Set(varSelectedCalendarDate, varCalendarMonth);
                                      Reset(S5MonthPicker)
                                    Text: ="‹"
                                    Width: =48
                              - S5MonthPicker:
                                  Control: ModernDatePicker
                                  Properties:
                                    AccessibleLabel: ="연도와 월 선택"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Appearance: =Appearance.Outline
                                    ContentLanguage: ="ko-KR"
                                    DefaultDate: =Coalesce(varSelectedCalendarDate, varCalendarMonth, Today())
                                    FillPortions: =1
                                    Format: =DatePickerFormat.YearMonth
                                    Height: =48
                                    LayoutMinWidth: =0
                                    OnChange: |-
                                      =Set(varSelectedCalendarDate, Self.SelectedDate);
                                      Set(varCalendarMonth, Date(Year(varSelectedCalendarDate), Month(varSelectedCalendarDate), 1))
                                    Placeholder: ="연도와 월 선택"
                                    StartOfWeek: =StartOfWeek.Monday
                              - S5NextMonth:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: ="다음 달"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Appearance: =ButtonAppearance.Subtle
                                    Height: =48
                                    Layout: =ButtonLayout.TextOnly
                                    LayoutMinWidth: =48
                                    OnSelect: |-
                                      =Set(varCalendarMonth, DateAdd(Date(Year(Coalesce(varCalendarMonth, Today())), Month(Coalesce(varCalendarMonth, Today())), 1), 1, TimeUnit.Months));
                                      Set(varSelectedCalendarDate, varCalendarMonth);
                                      Reset(S5MonthPicker)
                                    Text: ="›"
                                    Width: =48
                        - S5WeekdayHeader:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              Height: =36
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - S5WeekdayMon:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="월요일"
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(50, 60, 75, 1)
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Semibold
                                    LayoutMinWidth: =0
                                    Size: =14
                                    Text: ="월"
                              - S5WeekdayTue:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="화요일"
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(50, 60, 75, 1)
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Semibold
                                    LayoutMinWidth: =0
                                    Size: =14
                                    Text: ="화"
                              - S5WeekdayWed:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="수요일"
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(50, 60, 75, 1)
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Semibold
                                    LayoutMinWidth: =0
                                    Size: =14
                                    Text: ="수"
                              - S5WeekdayThu:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="목요일"
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(50, 60, 75, 1)
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Semibold
                                    LayoutMinWidth: =0
                                    Size: =14
                                    Text: ="목"
                              - S5WeekdayFri:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="금요일"
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(50, 60, 75, 1)
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Semibold
                                    LayoutMinWidth: =0
                                    Size: =14
                                    Text: ="금"
                              - S5WeekdaySat:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="토요일"
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(55, 105, 185, 1)
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Semibold
                                    LayoutMinWidth: =0
                                    Size: =14
                                    Text: ="토"
                              - S5WeekdaySun:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: ="일요일"
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Color: =RGBA(190, 75, 75, 1)
                                    FillPortions: =1
                                    FontWeight: =FontWeight.Semibold
                                    LayoutMinWidth: =0
                                    Size: =14
                                    Text: ="일"
                        - S5CalendarGrid:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              AccessibleLabel: ="월간 달력"
                              FillPortions: =0
                              Height: =276
                              Items: |-
                                =With(
                                    {monthStart: Date(Year(Coalesce(varCalendarMonth, Today())), Month(Coalesce(varCalendarMonth, Today())), 1)},
                                    ForAll(
                                        Sequence(42),
                                        {
                                            CalendarDate: DateAdd(
                                                monthStart,
                                                Value - Weekday(monthStart, StartOfWeek.Monday),
                                                TimeUnit.Days
                                            )
                                        }
                                    )
                                )
                              LayoutMinHeight: =264
                              LayoutMinWidth: =0
                              ShowScrollbar: =false
                              TemplatePadding: =2
                              TemplateSize: =44
                              Width: =Parent.Width
                              WrapCount: =7
                            Children:
                              - S5CalendarDay:
                                  Control: ModernText
                                  Properties:
                                    AccessibleLabel: =Text(ThisItem.CalendarDate, "yyyy년 m월 d일") & If(ThisItem.CalendarDate = varSelectedCalendarDate, ", 선택됨", "")
                                    Align: =Align.Center
                                    BorderColor: =RGBA(35, 95, 195, 1)
                                    BorderThickness: =If(ThisItem.CalendarDate = varSelectedCalendarDate, 2, 0)
                                    Color: =If(Month(ThisItem.CalendarDate) = Month(Coalesce(varCalendarMonth, Today())), RGBA(32, 44, 60, 1), RGBA(160, 168, 178, 1))
                                    Fill: =If(ThisItem.CalendarDate = Today(), RGBA(232, 240, 254, 1), RGBA(0, 0, 0, 0))
                                    Height: =Parent.TemplateHeight
                                    OnSelect: |-
                                      =Set(varSelectedCalendarDate, ThisItem.CalendarDate);
                                      Set(varCalendarMonth, Date(Year(varSelectedCalendarDate), Month(varSelectedCalendarDate), 1))
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Text: =Text(ThisItem.CalendarDate, "d")
                                    Width: =Parent.TemplateWidth
                              - S5SelectedDateOutline:
                                  Control: ModernText
                                  Properties:
                                    BorderColor: =RGBA(35, 95, 195, 1)
                                    BorderThickness: =2
                                    Fill: =RGBA(0, 0, 0, 0)
                                    Height: =Parent.TemplateHeight
                                    OnSelect: |-
                                      =Set(varSelectedCalendarDate, ThisItem.CalendarDate);
                                      Set(varCalendarMonth, Date(Year(varSelectedCalendarDate), Month(varSelectedCalendarDate), 1))
                                    RadiusBottomLeft: =6
                                    RadiusBottomRight: =6
                                    RadiusTopLeft: =6
                                    RadiusTopRight: =6
                                    Text: =""
                                    Visible: =ThisItem.CalendarDate = varSelectedCalendarDate
                                    Width: =Parent.TemplateWidth
                              - S5CalendarDayHitTarget:
                                  Control: ModernButton
                                  Properties:
                                    AccessibleLabel: =Text(ThisItem.CalendarDate, "yyyy년 m월 d일 선택")
                                    Appearance: =ButtonAppearance.Transparent
                                    Height: =Parent.TemplateHeight
                                    Layout: =ButtonLayout.TextOnly
                                    OnSelect: |-
                                      =Set(varSelectedCalendarDate, ThisItem.CalendarDate);
                                      Set(varCalendarMonth, Date(Year(varSelectedCalendarDate), Month(varSelectedCalendarDate), 1))
                                    Text: =""
                                    Width: =Parent.TemplateWidth
