                              AccessibleLabel: ="프로젝트명 입력란 레이블"
                              AlignInContainer: =AlignInContainer.Stretch
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: ="프로젝트명"
                              Width: =Parent.Width
                              Wrap: =false
                        - S3ProjectInput:
                            Control: ModernTextInput
                            Properties:
                              AccessibleLabel: ="프로젝트명"
                              AlignInContainer: =AlignInContainer.Stretch
                              Height: =44
                              Placeholder: ="프로젝트명을 입력하세요"
                              Required: =true
                              Width: =Parent.Width
                        - S3LocationLabel:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="근무 장소 입력란 레이블"
                              AlignInContainer: =AlignInContainer.Stretch
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: ="근무 장소"
                              Width: =Parent.Width
