                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="주말근무 완료 신청"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(32, 39, 48, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =38
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =24
                              Text: ="주말근무 완료 신청"
                              Width: =Parent.Width
                              Wrap: =false
                        - S3Subtitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="완료된 주말근무 입력 안내. 저장 기능은 연결되지 않았습니다."
