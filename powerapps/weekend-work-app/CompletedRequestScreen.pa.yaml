                              AlignInContainer: =AlignInContainer.Stretch
                              Height: =44
                              Placeholder: ="장소를 입력하세요"
                              Required: =true
                              Width: =Parent.Width
                  - S3DetailCard:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(224, 228, 233, 1)
                        BorderThickness: =1
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =158
