                        PaddingBottom: =16
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =16
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =Parent.Width
                      Children:
                        - S3ApplicantHeading:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="신청자 및 근무일"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(32, 39, 48, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =28
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =17
                              Text: ="신청자 및 근무일"
                              Width: =Parent.Width
