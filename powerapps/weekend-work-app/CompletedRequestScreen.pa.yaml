                        Width: =72
                  - S3PhoneTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="주말근무 완료 신청"
                        Align: =Align.Right
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(32, 39, 48, 1)
                        FillPortions: =1
                        FontWeight: =FontWeight.Semibold
                        Height: =40
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =17
                        Text: ="완료 신청"
                        Width: =Parent.Width - 100
                        Wrap: =false
            - S3PhoneNav:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(239, 241, 244, 1)
                  FillPortions: =0
                  Height: =328
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =8
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =8
                  Visible: =Parent.Width < 720 && locNavOpen
                  Width: =Parent.Width
                Children:
                  - S3PhoneNavHome:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="홈으로 이동"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        OnSelect: =Navigate(Screen1)
                        Text: ="홈"
                        Width: =Parent.Width
                  - S3PhoneNavPlanned:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 예정 신청 화면으로 이동"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        OnSelect: =Navigate(PlannedRequestScreen)
                        Text: ="주말근무 예정 신청"
                        Width: =Parent.Width
                  - S3PhoneNavCompleted:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 완료 신청, 현재 화면"
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =48
                        OnSelect: =Navigate(CompletedRequestScreen)
                        Text: ="주말근무 완료 신청"
                        Width: =Parent.Width
                  - S3PhoneNavInquiry:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="조회 안내 화면으로 이동"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        OnSelect: =Navigate(InquiryScreen)
                        Text: ="조회"
                        Width: =Parent.Width
                  - S3PhoneNavCalendar:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="캘린더 안내 화면으로 이동"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        OnSelect: =Navigate(CalendarScreen)
                        Text: ="캘린더"
                        Width: =Parent.Width
                  - S3PhoneNavAdmin:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="관리자 조회 안내 화면으로 이동"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        OnSelect: =Navigate(AdminScreen)
                        Text: ="관리자 조회"
                        Width: =Parent.Width
