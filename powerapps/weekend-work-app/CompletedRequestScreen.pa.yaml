Screens:
  CompletedRequestScreen:
    Properties:
      Fill: =RGBA(246, 247, 249, 1)
    Children:
      - S3Root:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(246, 247, 249, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =If(Parent.Width < 720, LayoutDirection.Vertical, LayoutDirection.Horizontal)
            Width: =Parent.Width
          Children:
            - S3DesktopRail:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(239, 241, 244, 1)
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =16
                  PaddingLeft: =14
                  PaddingRight: =14
                  PaddingTop: =22
                  Visible: =Parent.Width >= 720
                  Width: =220
                Children:
                  - S3RailTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="주말근무 신청 시스템"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(32, 39, 48, 1)
                        FontWeight: =FontWeight.Semibold
                        Height: =54
                        PaddingBottom: =4
                        PaddingLeft: =4
                        PaddingRight: =4
                        PaddingTop: =4
                        Size: =18
                        Text: ="주말근무 신청 시스템"
                        Width: =Parent.Width
                  - S3NavHome:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="홈으로 이동"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        OnSelect: =Navigate(Screen1)
                        Text: ="홈"
                        Width: =Parent.Width
                  - S3NavPlanned:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 예정 신청 화면으로 이동"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        OnSelect: =Navigate(PlannedRequestScreen)
                        Text: ="주말근무 예정 신청"
                        Width: =Parent.Width
                  - S3NavCompleted:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 완료 신청, 현재 화면"
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =48
                        OnSelect: =Navigate(CompletedRequestScreen)
                        Text: ="주말근무 완료 신청"
                        Width: =Parent.Width
                  - S3NavInquiry:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="조회 안내 화면으로 이동"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        OnSelect: =Navigate(InquiryScreen)
                        Text: ="조회"
                        Width: =Parent.Width
                  - S3NavCalendar:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="캘린더 안내 화면으로 이동"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        OnSelect: =Navigate(CalendarScreen)
                        Text: ="캘린더"
                        Width: =Parent.Width
                  - S3NavAdmin:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="관리자 조회 안내 화면으로 이동"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        OnSelect: =Navigate(AdminScreen)
                        Text: ="관리자 조회"
                        Width: =Parent.Width
            - S3PhoneHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =60
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =8
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =8
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =8
                  Visible: =Parent.Width < 720
                  Width: =Parent.Width
                Children:
                  - S3MenuToggle:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="탐색 메뉴 열기 또는 닫기"
                        Appearance: =ButtonAppearance.Outline
                        Height: =44
                        OnSelect: |-
                          =UpdateContext({locNavOpen: !locNavOpen})
