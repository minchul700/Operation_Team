                              Color: =RGBA(91, 99, 109, 1)
                              Height: =40
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: ="이미 완료한 주말근무 내용을 입력합니다. 입력 내용은 저장되지 않습니다."
                              Width: =Parent.Width
                  - S3ApplicantCard:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(224, 228, 233, 1)
