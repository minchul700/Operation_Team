                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="근무 정보"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(32, 39, 48, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =28
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =17
                              Text: ="근무 정보"
                              Width: =Parent.Width
