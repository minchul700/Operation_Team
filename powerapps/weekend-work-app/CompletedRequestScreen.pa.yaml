                              Width: =Parent.Width
                        - S3TeamLabel:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="소속 또는 팀 입력란 레이블"
                              AlignInContainer: =AlignInContainer.Stretch
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: ="소속 / 팀"
                              Width: =Parent.Width
                              Wrap: =false
                        - S3TeamInput:
                            Control: ModernTextInput
                            Properties:
                              AccessibleLabel: ="소속 또는 팀"
                              AlignInContainer: =AlignInContainer.Stretch
                              Height: =44
                              Placeholder: ="소속 또는 팀을 입력하세요"
                              Required: =true
                              Width: =Parent.Width
                        - S3ActualDateLabel:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="실제 근무일 선택란 레이블"
                              AlignInContainer: =AlignInContainer.Stretch
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: ="실제 근무일"
                              Width: =Parent.Width
                              Wrap: =false
                        - S3ActualDateInput:
                            Control: ModernDatePicker
                            Properties:
                              AccessibleLabel: ="실제 근무일"
                              AlignInContainer: =AlignInContainer.Stretch
                              DefaultDate: =Today()
                              Format: =DatePickerFormat.Short
                              Height: =44
                              Placeholder: ="실제 근무일 선택"
                              StartOfWeek: =StartOfWeek.Monday
                              Width: =Parent.Width
                  - S3WorkCard:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(224, 228, 233, 1)
