                              Height: =28
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =17
                              Text: ="세부 근무 내용"
                              Width: =Parent.Width
                              Wrap: =false
                        - S3DetailInput:
                            Control: ModernTextInput
                            Properties:
                              AccessibleLabel: ="세부 근무 내용"
                              AlignInContainer: =AlignInContainer.Stretch
                              Height: =80
                              Placeholder: ="완료한 근무 내용을 입력하세요"
                              Required: =true
                              Type: =TextInputType.Multiline
                              Width: =Parent.Width
                  - S3TimeCard:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(224, 228, 233, 1)
                        BorderThickness: =1
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =280
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =16
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =16
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Width: =Parent.Width
                      Children:
                        - S3TimeHeading:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="근무 시간"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(32, 39, 48, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =28
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =17
                              Text: ="근무 시간"
                              Width: =Parent.Width
                              Wrap: =false
                        - S3StartLabel:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="시작 시각은 24시간 HH:mm 형식입니다"
                              AlignInContainer: =AlignInContainer.Stretch
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: ="시작 시각 (24시간 HH:mm)"
                              Width: =Parent.Width
                              Wrap: =false
                        - S3StartInput:
                            Control: ModernTextInput
                            Properties:
                              AccessibleLabel: ="시작 시각, 24시간 HH:mm 형식"
                              AlignInContainer: =AlignInContainer.Stretch
                              Height: =44
                              Placeholder: |-
                                ="예: 09:00"
                              Width: =Parent.Width
                        - S3EndLabel:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="종료 시각은 24시간 HH:mm 형식입니다"
                              AlignInContainer: =AlignInContainer.Stretch
                              FontWeight: =FontWeight.Semibold
                              Height: =22
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: ="종료 시각 (24시간 HH:mm)"
                              Width: =Parent.Width
                              Wrap: =false
                        - S3EndInput:
                            Control: ModernTextInput
                            Properties:
                              AccessibleLabel: ="종료 시각, 24시간 HH:mm 형식"
                              AlignInContainer: =AlignInContainer.Stretch
                              Height: =44
                              Placeholder: |-
                                ="예: 18:00"
                              Width: =Parent.Width
                        - S3Duration:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="시작 및 종료 시각으로 계산한 총 근무 시간"
                              AlignInContainer: =AlignInContainer.Stretch
                              Color: =RGBA(0, 94, 184, 1)
                              FontWeight: =FontWeight.Semibold
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =16
                              Text: =If(IsBlank(S3StartInput.Text) || IsBlank(S3EndInput.Text), "", IfError(Text((DateDiff(TimeValue(S3StartInput.Text), TimeValue(S3EndInput.Text), TimeUnit.Minutes) + If(TimeValue(S3EndInput.Text) < TimeValue(S3StartInput.Text), 1440, 0)) / 60, "0.##") & "시간", ""))
                              Width: =Parent.Width
                              Wrap: =false
                  - S3ApprovalCard:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(190, 216, 244, 1)
                        BorderThickness: =1
                        Fill: =RGBA(235, 243, 252, 1)
