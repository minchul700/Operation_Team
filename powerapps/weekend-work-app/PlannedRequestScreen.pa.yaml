Screens:
  PlannedRequestScreen:
    Properties:
      Fill: =RGBA(245, 246, 248, 1)
    Children:
      - S2Root:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =If(Parent.Width < 720, LayoutDirection.Vertical, LayoutDirection.Horizontal)
            Width: =Parent.Width
          Children:
            - S2Navigation:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(240, 242, 245, 1)
                  FillPortions: =0
                  Height: =If(Parent.Width < 720, 176, Parent.Height)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(Parent.Width < 720, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutWrap: =Parent.Width < 720
                  PaddingBottom: =8
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =If(Parent.Width < 720, 8, 20)
                  Width: =If(Parent.Width < 720, Parent.Width, 220)
                Children:
                  - S2NavBrand:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="주말근무 신청 시스템"
                        Color: =RGBA(32, 44, 60, 1)
                        FontWeight: =FontWeight.Semibold
                        Height: =40
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =4
                        PaddingRight: =4
                        PaddingTop: =0
                        Size: =18
                        Text: ="주말근무 신청"
                        Visible: =Parent.Width >= 720
                        Width: =Parent.Width
                        Wrap: =false
                  - S2NavHome:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="홈으로 이동"
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        Layout: =ButtonLayout.TextOnly
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(Screen1, ScreenTransition.Fade)
                        Text: ="홈"
                        Width: =If(Parent.Width < 720, 96, Parent.Width)
                  - S2NavPlanned:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 예정 신청 화면, 현재 화면"
                        DisplayMode: =DisplayMode.Disabled
                        Height: =48
                        Layout: =ButtonLayout.TextOnly
                        LayoutMinWidth: =0
                        Text: ="예정 신청"
                        Width: =If(Parent.Width < 720, 120, Parent.Width)
                  - S2NavCompleted:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 완료 신청 화면"
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        Layout: =ButtonLayout.TextOnly
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(CompletedRequestScreen, ScreenTransition.Fade)
                        Text: ="완료 신청"
                        Width: =If(Parent.Width < 720, 120, Parent.Width)
                  - S2NavInquiry:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="조회 안내 화면"
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        Layout: =ButtonLayout.TextOnly
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(InquiryScreen, ScreenTransition.Fade)
                        Text: ="조회"
                        Width: =If(Parent.Width < 720, 96, Parent.Width)
                  - S2NavCalendar:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="캘린더 안내 화면"
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        Layout: =ButtonLayout.TextOnly
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(CalendarScreen, ScreenTransition.Fade)
                        Text: ="캘린더"
                        Width: =If(Parent.Width < 720, 110, Parent.Width)
                  - S2NavAdmin:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="관리자 안내 화면"
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        Layout: =ButtonLayout.TextOnly
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(AdminScreen, ScreenTransition.Fade)
                        Text: ="관리자 조회"
                        Width: =If(Parent.Width < 720, 120, Parent.Width)
            - S2Main:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(245, 246, 248, 1)
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =24
                  PaddingLeft: =If(Parent.Width < 720, 16, 32)
                  PaddingRight: =If(Parent.Width < 720, 16, 32)
                  PaddingTop: =20
                  Width: =Parent.Width
                Children:
                  - S2Heading:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =92
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - S2Title:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="주말근무 예정 사전신청"
                              AutoHeight: =true
                              Color: =RGBA(32, 44, 60, 1)
                              FontWeight: =FontWeight.Semibold
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =24
                              Text: ="주말근무 예정 사전신청"
                        - S2Intro:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="저장 및 제출 기능이 연결되지 않은 입력 미리보기"
                              AutoHeight: =true
                              Color: =RGBA(92, 102, 115, 1)
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: ="주말근무 예정 정보를 입력하세요. 이 화면은 저장 및 제출 기능이 연결되지 않은 입력 미리보기입니다."
                  - S2Form:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(226, 230, 235, 1)
                        BorderThickness: =1
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =1700
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =10
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =20
                        PaddingLeft: =If(Parent.Width < 720, 16, 24)
                        PaddingRight: =If(Parent.Width < 720, 16, 24)
                        PaddingTop: =20
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                      Children:
                        - S2ApplicantLabel:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="신청자 이름 라벨"
                              Color: =RGBA(32, 44, 60, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: ="신청자 이름"
                              Wrap: =false
                        - S2ApplicantInput:
                            Control: ModernTextInput
                            Properties:
                              AccessibleLabel: ="신청자 이름"
                              Height: =44
                              LayoutMinWidth: =0
                              Placeholder: ="이름을 입력하세요"
                              Width: =Parent.Width
                        - S2DepartmentLabel:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="소속 / 팀 라벨"
                              Color: =RGBA(32, 44, 60, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: ="소속 / 팀"
                              Wrap: =false
                        - S2DepartmentInput:
                            Control: ModernTextInput
                            Properties:
                              AccessibleLabel: ="소속 / 팀"
                              Height: =44
                              LayoutMinWidth: =0
                              Placeholder: ="소속 또는 팀을 입력하세요"
                              Width: =Parent.Width
                        - S2RequestDateLabel:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="신청일 (오늘 날짜, 읽기 전용) 라벨"
                              Color: =RGBA(32, 44, 60, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: ="신청일 (오늘 날짜, 읽기 전용)"
                              Wrap: =false
                        - S2RequestDateInput:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="오늘 날짜로 자동 표시되는 읽기 전용 신청일"
                              BorderColor: =RGBA(220, 225, 231, 1)
                              BorderStyle: =BorderStyle.Solid
                              BorderThickness: =1
                              Color: =RGBA(50, 60, 75, 1)
                              Fill: =RGBA(246, 248, 250, 1)
                              Height: =44
                              LayoutMinWidth: =0
                              PaddingBottom: =8
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =12
                              Size: =16
                              Text: =Text(Today(), "yyyy-mm-dd")
                              Wrap: =false
                        - S2PlannedDateLabel:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="근무 예정일 라벨"
                              Color: =RGBA(32, 44, 60, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: ="근무 예정일"
                              Wrap: =false
                        - S2PlannedDateInput:
                            Control: ModernDatePicker
                            Properties:
                              AccessibleLabel: ="근무 예정일 선택"
                              DefaultDate: =Today()
                              Format: =DatePickerFormat.Short
                              Height: =44
                              LayoutMinWidth: =0
                              Placeholder: ="근무 예정일을 선택하세요"
                              StartOfWeek: =StartOfWeek.Monday
                              Width: =Parent.Width
                        - S2ProjectLabel:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="프로젝트명 라벨"
                              Color: =RGBA(32, 44, 60, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: ="프로젝트명"
                              Wrap: =false
                        - S2ProjectInput:
                            Control: ModernTextInput
                            Properties:
                              AccessibleLabel: ="프로젝트명"
                              Height: =44
                              LayoutMinWidth: =0
                              Placeholder: ="프로젝트명을 입력하세요"
                              Width: =Parent.Width
                        - S2LocationLabel:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="근무 장소 라벨"
                              Color: =RGBA(32, 44, 60, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: ="근무 장소"
                              Wrap: =false
                        - S2LocationInput:
                            Control: ModernTextInput
                            Properties:
                              AccessibleLabel: ="근무 장소"
                              Height: =44
                              LayoutMinWidth: =0
                              Placeholder: ="근무 장소를 입력하세요"
                              Width: =Parent.Width
                        - S2ReasonLabel:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="주말근무 사유 라벨"
                              Color: =RGBA(32, 44, 60, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: ="주말근무 사유 -> 매우 상세하게 기입, 상세기입 아닌경우 반려"
                              Wrap: =false
                        - S2ReasonInput:
                            Control: ModernTextInput
                            Properties:
                              AccessibleLabel: ="주말근무 사유"
                              Height: =84
                              LayoutMinWidth: =0
                              Placeholder: ="근무 사유를 입력하세요 -> 힌트텍스트로 예시 표기"
                              Type: =TextInputType.Multiline
                              Width: =Parent.Width
                        - S2DetailsLabel:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="주말근무 상세 내용 라벨"
                              Color: =RGBA(32, 44, 60, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: ="주말근무 상세 내용"
                              Wrap: =false
                        - S2DetailsInput:
                            Control: ModernTextInput
                            Properties:
                              AccessibleLabel: ="주말근무 상세 내용"
                              Height: =124
                              LayoutMinWidth: =0
                              Placeholder: ="수행할 업무를 자세히 입력하세요"
                              Type: =TextInputType.Multiline
                              Width: =Parent.Width
                        - S2StartTimeLabel:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="시작 시각 입력란 라벨"
                              AutoHeight: =true
                              Color: =RGBA(32, 44, 60, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =28
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: ="시작 시각 (24시간 HH:mm)"
                        - S2StartTimeInput:
                            Control: ModernTextInput
                            Properties:
                              AccessibleLabel: ="시작 시각, 24시간제 HH:mm 형식"
                              Height: =44
                              LayoutMinWidth: =0
                              MaxLength: =5
                              Placeholder: |-
                                ="예: 09:00"
                              Width: =Parent.Width
                        - S2EndTimeLabel:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="종료 시각 입력란 라벨"
                              AutoHeight: =true
                              Color: =RGBA(32, 44, 60, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =28
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: ="종료 시각 (24시간 HH:mm)"
                        - S2EndTimeInput:
                            Control: ModernTextInput
                            Properties:
                              AccessibleLabel: ="종료 시각, 24시간제 HH:mm 형식"
                              Height: =44
                              LayoutMinWidth: =0
                              MaxLength: =5
                              Placeholder: |-
                                ="예: 18:00"
                              Width: =Parent.Width
                        - S2DurationLabel:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="예상 근무시간 계산 결과 라벨"
                              Color: =RGBA(32, 44, 60, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: ="예상 근무시간"
                              Wrap: =false
                        - S2DurationValue:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="시작 및 종료 시각으로 계산한 예상 근무시간"
                              Color: =RGBA(0, 95, 184, 1)
                              Fill: =RGBA(239, 246, 252, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              LayoutMinWidth: =0
                              PaddingBottom: =8
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =12
                              Size: =16
                              Text: =If(Or(IsBlank(S2StartTimeInput.Text), IsBlank(S2EndTimeInput.Text)), "", IfError(Text((DateDiff(TimeValue(S2StartTimeInput.Text), TimeValue(S2EndTimeInput.Text), TimeUnit.Minutes) + If(TimeValue(S2EndTimeInput.Text) < TimeValue(S2StartTimeInput.Text), 1440, 0)) / 60, "0.##") & "시간", ""))
                              Wrap: =false
                        - S2ApprovalTitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="읽기 전용 승인 절차 안내"
                              Color: =RGBA(32, 44, 60, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =24
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: ="승인 절차 안내"
                              Wrap: =false
                        - S2ApprovalRoute:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: |-
                                ="안내용 승인 순서: 팀장, 본부장, 경영지원. 앱에서 승인을 처리하지 않습니다."
                              AutoHeight: =true
                              Color: =RGBA(50, 60, 75, 1)
                              Fill: =RGBA(246, 248, 250, 1)
                              Height: =44
                              LayoutMinWidth: =0
                              PaddingBottom: =12
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =12
                              Text: ="팀장 → 본부장 → 경영지원"
                        - S2SubmitButton:
                            Control: ModernButton
                            Properties:
                              AccessibleLabel: ="제출 기능이 연결되지 않아 비활성화된 버튼"
                              DisplayMode: =DisplayMode.Disabled
                              Height: =48
                              Layout: =ButtonLayout.TextOnly
                              LayoutMinWidth: =0
                              Text: ="제출"
                              Width: =Parent.Width
                        - S2SubmitNotice:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="입력 내용은 저장되거나 제출되지 않는다는 안내"
                              AutoHeight: =true
                              Color: =RGBA(92, 102, 115, 1)
                              Height: =42
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =14
                              Text: ="현재는 화면 미리보기 단계이며 입력 내용은 저장되거나 제출되지 않습니다."
