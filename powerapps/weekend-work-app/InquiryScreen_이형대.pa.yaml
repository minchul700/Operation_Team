Screens:
  InquiryScreen_이형대:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(0, 120, 212, 1)
    Children:
      - S4Root:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(245, 246, 248, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =If(Parent.Width < 720, LayoutDirection.Vertical, LayoutDirection.Horizontal)
            Width: =Parent.Width
          Children:
            - S4DesktopRail:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(248, 249, 251, 1)
                  FillPortions: =0
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =20
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =20
                  Visible: =Parent.Width >= 720
                  Width: =220
                Children:
                  - S4RailTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="주말근무 신청 시스템"
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =RGBA(32, 42, 57, 1)
                        FontWeight: ='FontWeight'.Semibold
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        Size: =18
                        Text: ="주말근무 신청"
                        Width: =Parent.Width - 24
                  - S4NavHome:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="홈 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(HomeScreen_이승우)
                        Text: ="홈"
                        Width: =Parent.Width - 24
                  - S4NavPlanned:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 예정 신청 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(PlannedRequestScreen_권민철)
                        Text: ="주말근무 예정 신청"
                        Width: =Parent.Width - 24
                  - S4NavCompleted:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 완료 신청 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(CompletedRequestScreen_윤대진)
                        Text: ="주말근무 완료 신청"
                        Width: =Parent.Width - 24
                  - S4NavInquiry:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 신청 조회 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Primary
                        Height: =48
                        OnSelect: =Navigate(InquiryScreen_이형대)
                        Text: ="조회"
                        Width: =Parent.Width - 24
                  - S4NavCalendar:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="캘린더 안내 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(CalendarScreen_최해우)
                        Text: ="캘린더"
                        Width: =Parent.Width - 24
                  - S4NavAdmin:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="관리자 조회 안내 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(AdminScreen_김진현)
                        Text: ="관리자 조회"
                        Width: =Parent.Width - 24
            - S4PhoneTopBar:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =8
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =8
                  Visible: =Parent.Width < 720
                  Width: =Parent.Width
                Children:
                  - S4PhoneMenuButton:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: =If(Coalesce(locNavOpen, false), "탐색 메뉴 닫기", "탐색 메뉴 열기")
                        AlignInContainer: =AlignInContainer.Center
                        Appearance: ='ButtonAppearance'.Secondary
                        Height: =48
                        OnSelect: |-
                          =UpdateContext({locNavOpen: !Coalesce(locNavOpen, false)})
                        Text: =If(Coalesce(locNavOpen, false), "닫기", "메뉴")
                        Width: =64
                  - S4PhoneTitle:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="주말근무 신청 시스템"
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =RGBA(32, 42, 57, 1)
                        FillPortions: =1
                        FontWeight: ='FontWeight'.Semibold
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =18
                        Text: ="주말근무 신청"
            - S4PhoneNavigation:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =320
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =4
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =8
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =8
                  Visible: =Parent.Width < 720 && Coalesce(locNavOpen, false)
                  Width: =Parent.Width
                Children:
                  - S4PhoneNavHome:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="홈 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(HomeScreen_이승우)
                        Text: ="홈"
                        Width: =Parent.Width - 24
                  - S4PhoneNavPlanned:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 예정 신청 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(PlannedRequestScreen_권민철)
                        Text: ="주말근무 예정 신청"
                        Width: =Parent.Width - 24
                  - S4PhoneNavCompleted:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 완료 신청 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(CompletedRequestScreen_윤대진)
                        Text: ="주말근무 완료 신청"
                        Width: =Parent.Width - 24
                  - S4PhoneNavInquiry:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 신청 조회 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Primary
                        Height: =48
                        OnSelect: =Navigate(InquiryScreen_이형대)
                        Text: ="조회"
                        Width: =Parent.Width - 24
                  - S4PhoneNavCalendar:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="캘린더 안내 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(CalendarScreen_최해우)
                        Text: ="캘린더"
                        Width: =Parent.Width - 24
                  - S4PhoneNavAdmin:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="관리자 조회 안내 화면 열기"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonAppearance'.Subtle
                        Height: =48
                        OnSelect: =Navigate(AdminScreen_김진현)
                        Text: ="관리자 조회"
                        Width: =Parent.Width - 24
            - S4MainContent:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(245, 246, 248, 1)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =20
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =28
                  PaddingLeft: =If(Parent.Width < 720, 16, 32)
                  PaddingRight: =If(Parent.Width < 720, 16, 32)
                  PaddingTop: =28
                Children:
                  - S4PageHeading:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: |-
                          ="페이지 제목: 주말근무 신청 조회"
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =RGBA(32, 42, 57, 1)
                        FontWeight: ='FontWeight'.Semibold
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =28
                        Text: ="주말근무 신청 조회"
                  - S4Description:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="신청 조회 화면 안내"
                        AlignInContainer: =AlignInContainer.Stretch
                        AutoHeight: =true
                        Color: =RGBA(83, 94, 108, 1)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: ="본인이 제출한 주말근무 신청과 승인 상태를 확인할 수 있습니다."
                  - S4GuidanceCard:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(224, 228, 233, 1)
                        BorderThickness: =1
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =160
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =24
                        PaddingLeft: =24
                        PaddingRight: =24
                        PaddingTop: =24
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                      Children:
                        - S4GuidanceTitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="조회 안내"
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =RGBA(32, 42, 57, 1)
                              FontWeight: ='FontWeight'.Semibold
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =18
                              Text: ="내 신청 현황"
                              Wrap: =false
                        - S4GuidanceMessage:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="본인 신청 내역 목록에서 항목을 선택하면 상세 내용과 반려 사유를 볼 수 있습니다."
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =RGBA(83, 94, 108, 1)
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =16
                              Text: =If(IsBlank(LookUp(TB_WeekendWorkRequests, lsw_applicantemail = User().Email)), "아직 제출한 신청이 없습니다.", "아래 목록에서 신청을 선택하면 상세 내용과 반려 사유를 볼 수 있습니다.")
                  - S4HomeButton:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="홈으로 돌아가기"
                        AlignInContainer: =AlignInContainer.Start
                        Appearance: ='ButtonAppearance'.Secondary
                        Height: =48
                        OnSelect: =Navigate(HomeScreen_이승우)
                        Text: ="홈으로 돌아가기"
                        Width: =220
                  - S4InquiryButton:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="신청 내역 새로고침"
                        AlignInContainer: =AlignInContainer.Start
                        Appearance: ='ButtonAppearance'.Primary
                        Height: =48
                        OnSelect: =Refresh(TB_WeekendWorkRequests)
                        Text: ="새로고침"
                        Tooltip: ="최신 승인 상태를 다시 불러옵니다."
                        Width: =220
                  - S4RequestGallery:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        AccessibleLabel: ="본인 주말근무 신청 목록"
                        FillPortions: =0
                        Height: =340
                        Items: |-
                          =SortByColumns(
                              Filter(TB_WeekendWorkRequests, lsw_applicantemail = User().Email),
                              "lsw_workdate",
                              SortOrder.Descending
                          )
                        LayoutMinHeight: =260
                        LayoutMinWidth: =0
                        TabIndex: =0
                        TemplatePadding: =6
                        TemplateSize: =84
                        Width: =Parent.Width
                      Children:
                        - S4RequestSummary:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="신청 근무일, 종류, 승인 상태"
                              Color: =RGBA(32, 42, 57, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =34
                              OnSelect: =Select(Parent)
                              Size: =16
                              Text: =Text(ThisItem.lsw_workdate, "yyyy-mm-dd") & " · " & If(ThisItem.lsw_requesttype = "Planned", "예정", "완료") & " · " & Coalesce(ThisItem.lsw_approvalstatus, "접수")
                              Width: =Parent.TemplateWidth - 16
                              X: =8
                              Y: =6
                        - S4RequestProject:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="신청 프로젝트 및 근무 시각"
                              Color: =RGBA(83, 94, 108, 1)
                              Height: =30
                              OnSelect: =Select(Parent)
                              Size: =14
                              Text: =Coalesce(ThisItem.lsw_projectname, "프로젝트 미입력") & " · " & Coalesce(ThisItem.lsw_startat, "") & "~" & Coalesce(ThisItem.lsw_endat, "")
                              Width: =Parent.TemplateWidth - 16
                              X: =8
                              Y: =42
                  - S4SelectedDetailCard:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(224, 228, 233, 1)
                        BorderThickness: =1
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =300
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =20
                        PaddingLeft: =20
                        PaddingRight: =20
                        PaddingTop: =20
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                      Children:
                        - S4SelectedDetailTitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="선택한 신청 상세"
                              AutoHeight: =true
                              Color: =RGBA(32, 42, 57, 1)
                              FontWeight: =FontWeight.Semibold
                              Size: =18
                              Text: ="신청 상세"
                        - S4SelectedDetailText:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="선택한 신청의 근무일, 장소, 사유, 상세 내용, 승인 상태 및 반려 사유"
                              AutoHeight: =true
                              Color: =RGBA(50, 60, 75, 1)
                              Text: |-
                                =With(
                                    {request: S4RequestGallery.Selected},
                                    If(
                                        IsBlank(request.lsw_tb_weekendworkrequestid),
                                        "목록에서 신청을 선택하세요.",
                                        "근무일: " & Text(request.lsw_workdate, "yyyy-mm-dd") & Char(10) &
                                        "승인 상태: " & Coalesce(request.lsw_approvalstatus, "접수") & Char(10) &
                                        "진행 단계: " & Text(request.lsw_currentstage) & "차" & Char(10) &
                                        "프로젝트: " & Coalesce(request.lsw_projectname, "") & Char(10) &
                                        "근무 장소: " & Coalesce(request.lsw_worklocation, "") & Char(10) &
                                        "근무 시각: " & Coalesce(request.lsw_startat, "") & "~" & Coalesce(request.lsw_endat, "") & Char(10) &
                                        "신청 사유: " & Coalesce(request.lsw_reason, "") & Char(10) &
                                        "상세 내용: " & Coalesce(request.lsw_details, "") &
                                        If(IsBlank(request.lsw_rejectionreason), "", Char(10) & "반려 사유: " & request.lsw_rejectionreason)
                                    )
                                )
