Screens:
  CalendarScreen:
    Properties:
      Fill: =RGBA(245, 246, 248, 1)
    Children:
      - S5Root:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =If(Parent.Width < 720, LayoutDirection.Vertical, LayoutDirection.Horizontal)
            Width: =Parent.Width
          Children:
            - S5Navigation:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(240, 242, 245, 1)
                  FillPortions: =0
                  Height: =If(Parent.Width < 720, 176, Parent.Height)
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =If(Parent.Width < 720, LayoutDirection.Horizontal, LayoutDirection.Vertical)
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutWrap: =Parent.Width < 720
                  PaddingBottom: =8
                  PaddingLeft: =12
                  PaddingRight: =12
                  PaddingTop: =If(Parent.Width < 720, 8, 20)
                  Width: =If(Parent.Width < 720, Parent.Width, 220)
                Children:
                  - S5NavBrand:
                      Control: ModernText
                      Properties:
                        AccessibleLabel: ="주말근무 신청 시스템"
                        AlignInContainer: =AlignInContainer.Stretch
                        Color: =RGBA(32, 44, 60, 1)
                        FontWeight: =FontWeight.Semibold
                        Height: =40
                        LayoutMinWidth: =0
                        PaddingBottom: =0
                        PaddingLeft: =4
                        PaddingRight: =4
                        PaddingTop: =0
                        Size: =18
                        Text: ="주말근무 신청"
                        Visible: =Parent.Width >= 720
                        Width: =Parent.Width
                        Wrap: =false
                  - S5NavHome:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="홈으로 이동"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        Layout: =ButtonLayout.TextOnly
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(Screen1, ScreenTransition.Fade)
                        Text: ="홈"
                        Width: =If(Parent.Width < 720, 96, Parent.Width)
                  - S5NavPlanned:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 예정 신청 화면"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        Layout: =ButtonLayout.TextOnly
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(PlannedRequestScreen, ScreenTransition.Fade)
                        Text: ="예정 신청"
                        Width: =If(Parent.Width < 720, 120, Parent.Width)
                  - S5NavCompleted:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 완료 신청 화면"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        Layout: =ButtonLayout.TextOnly
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(CompletedRequestScreen, ScreenTransition.Fade)
                        Text: ="완료 신청"
                        Width: =If(Parent.Width < 720, 120, Parent.Width)
                  - S5NavInquiry:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="조회 안내 화면"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        Layout: =ButtonLayout.TextOnly
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(InquiryScreen, ScreenTransition.Fade)
                        Text: ="조회"
                        Width: =If(Parent.Width < 720, 96, Parent.Width)
                  - S5NavCalendar:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="주말근무 캘린더 화면, 현재 화면"
                        AlignInContainer: =AlignInContainer.Stretch
                        DisplayMode: =DisplayMode.Disabled
                        Height: =48
                        Layout: =ButtonLayout.TextOnly
                        LayoutMinWidth: =0
                        Text: ="캘린더"
                        Width: =If(Parent.Width < 720, 110, Parent.Width)
                  - S5NavAdmin:
                      Control: ModernButton
                      Properties:
                        AccessibleLabel: ="관리자 안내 화면"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: =ButtonAppearance.Subtle
                        Height: =48
                        Layout: =ButtonLayout.TextOnly
                        LayoutMinWidth: =0
                        OnSelect: =Navigate(AdminScreen, ScreenTransition.Fade)
                        Text: ="관리자 조회"
                        Width: =If(Parent.Width < 720, 120, Parent.Width)
            - S5Main:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(245, 246, 248, 1)
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =24
                  PaddingLeft: =If(Parent.Width < 720, 16, 32)
                  PaddingRight: =If(Parent.Width < 720, 16, 32)
                  PaddingTop: =24
                  Width: =Parent.Width
                Children:
                  - S5PageHeading:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =56
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                      Children:
                        - S5PageTitle:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="주말근무 캘린더"
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =RGBA(32, 44, 60, 1)
                              FontWeight: =FontWeight.Semibold
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =24
                              Text: ="주말근무 캘린더"
                  - S5GuidanceCard:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        BorderColor: =RGBA(226, 230, 235, 1)
                        BorderThickness: =1
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =148
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =24
                        PaddingLeft: =24
                        PaddingRight: =24
                        PaddingTop: =24
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                      Children:
                        - S5GuidanceMessage:
                            Control: ModernText
                            Properties:
                              AccessibleLabel: ="일정 정보는 주말근무 데이터 연결 후 표시됩니다."
                              AlignInContainer: =AlignInContainer.Stretch
                              AutoHeight: =true
                              Color: =RGBA(50, 60, 75, 1)
                              Height: =48
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =16
                              Text: ="일정 정보는 주말근무 데이터 연결 후 표시됩니다."
